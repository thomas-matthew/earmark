[project]
name = "earmark"
version = "0.1.0"
description = "Turns saved bookmarks into a private, full-length podcast"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.179",
    "en-core-web-sm",
    "laya>=0.4.30",
    "misaki[en]>=0.9.4",
    "mlx-audio>=0.6.5",
    "soundfile>=0.14.0",
    "trafilatura>=2.3.1",
    "yt-dlp>=2026.10.26",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
