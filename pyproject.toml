[project]
name = "earmark"
version = "0.1.0"
description = "Turns saved bookmarks into a private, full-length podcast"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.180",
    "en-core-web-sm",
    "misaki[en]>=0.9.4",
    "mlx-audio>=0.6.5",
    "playwright>=1.65.1",
    "soundfile>=0.14.0",
    "trafilatura>=2.3.1",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
earmark = "earmark.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
